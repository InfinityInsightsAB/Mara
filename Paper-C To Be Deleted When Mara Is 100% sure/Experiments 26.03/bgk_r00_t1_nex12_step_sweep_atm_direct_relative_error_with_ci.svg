<text x="72" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64748b">Hybrid uses the tuned setting: 60,000 paths, 301 asset points, range 0.30 to 3.50, vol quantile 0.999.</text>
<text x="72" y="174" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64748b">Relative errors are measured against the fixed benchmark direct reference while Euler steps vary and exercise dates stay at 12.</text>
